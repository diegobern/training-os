# Training OS — cuentas de verdad en la app de iOS, en un Mac de GitHub Actions.
#
# La app se empaqueta en modo `test` (`.env.test`): Firebase Auth, Firestore y
# Storage apuntan a los EMULADORES locales de Firebase, que se arrancan en este
# mismo job (proyecto `demo-training-os`: no toca ningún proyecto real ni
# necesita credenciales). El simulador comparte la red del Mac, así que la app
# llega a 127.0.0.1.
#
# Los tests (ios/App/TrainingOSUITests/AuthFlowUITests.swift) se ejecutan de
# uno en uno y en orden; entre medias, este job comprueba en Firestore y en
# Auth, por su API REST, que lo que se ve en la pantalla ha pasado de verdad, y
# corta y devuelve la red para el arranque sin conexión.
#
# Cada comprobación deja una línea PASS/FAIL en evidence/auth/checks.txt. Un
# test que falla NO para el job: se siguen ejecutando los demás, se publica la
# evidencia y, al final, el job falla si hay algún FAIL.
#
# Las cuentas (emails, usuarios y contraseña) se generan en cada ejecución y
# sólo existen en el emulador de este job, que se destruye al terminar: no son
# secretos, y pueden aparecer en los registros publicados.
#
# La evidencia se publica en la rama `ios-ci-evidence-auth`, carpeta `auth/`
# (separada de `ios-ci-evidence`, que es de ios.yml: no se pisan).
name: iOS auth (emuladores de Firebase)

on:
  push:
    branches: [ios-parity]
  workflow_dispatch:

permissions:
  contents: write # únicamente para publicar la evidencia en ios-ci-evidence-auth

concurrency:
  group: ios-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      EVIDENCE: ${{ github.workspace }}/evidence/auth
      XCODE_APP: /Applications/Xcode_26.6.app
      PROJECT: ios/App/App.xcodeproj
      FB_PROJECT: demo-training-os
    steps:
      - uses: actions/checkout@v4

      - name: Carpeta de evidencia
        run: |
          mkdir -p "$EVIDENCE"
          echo "commit $GITHUB_SHA run $GITHUB_RUN_NUMBER" > "$EVIDENCE/run.txt"
          : > "$EVIDENCE/checks.txt"

      - name: Utilidades del job
        run: |
          # Funciones que cargan (`source`) los pasos de abajo.
          cat > "$RUNNER_TEMP/auth-lib.sh" <<'LIB'
          # Sin `-e` (el shell de Actions lo pone): cada paso lee los códigos
          # de salida y decide; los que deben cortar el job hacen `exit` explícito.
          set +e
          CHECKS="$EVIDENCE/checks.txt"
          AUTH_API="http://127.0.0.1:9099"
          FS_API="http://127.0.0.1:8080/v1/projects/$FB_PROJECT/databases/(default)/documents"
          # El emulador acepta cualquier clave; es la misma de .env.test.
          API_KEY="fake-api-key-for-emulator"
          # Las colecciones que sincroniza la app (src/lib/firebase/paths.ts) y las lápidas.
          SYNCED="exercises routines sessions exerciseLogs personalRecords bodyweight measurements milestones exercisePrefs photos tombstones"

          pass() { echo "PASS $*" | tee -a "$CHECKS"; }
          fail() { echo "FAIL $*" | tee -a "$CHECKS"; }
          info() { echo "INFO $*" | tee -a "$CHECKS"; }

          # uid de una cuenta iniciando sesión con su contraseña en el emulador
          # de Auth; vacío si la cuenta no existe (o la contraseña no vale).
          uid_of() {
            curl -s -g --max-time 10 -H 'Content-Type: application/json' \
              -d "{\"email\":\"$1\",\"password\":\"$AUTH_PASSWORD\",\"returnSecureToken\":true}" \
              "$AUTH_API/identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=$API_KEY" |
              python3 -c 'import json, sys
          try:
              print(json.load(sys.stdin).get("localId", ""))
          except Exception:
              print("")'
          }

          # Número de documentos de users/<uid>/<colección>, leídos como
          # administrador del emulador («Bearer owner»: no pasa por las reglas,
          # es el test mirando la base de datos). -1 si no se pudo leer.
          fs_count() {
            curl -s -g --max-time 10 -H 'Authorization: Bearer owner' "$FS_API/users/$1/$2?pageSize=300" |
              python3 -c 'import json, sys
          try:
              d = json.load(sys.stdin)
              print(-1 if "error" in d else len(d.get("documents", [])))
          except Exception:
              print(-1)'
          }

          # Código HTTP de un documento de Firestore (200 existe, 404 no).
          fs_status() {
            curl -s -g -o /dev/null -w '%{http_code}' --max-time 10 -H 'Authorization: Bearer owner' "$FS_API/$1"
          }

          # Subcolecciones con documentos bajo un documento, separadas por
          # espacios; ERROR si el emulador no responde a listCollectionIds.
          fs_subcollections() {
            curl -s -g --max-time 10 -X POST -H 'Authorization: Bearer owner' -H 'Content-Type: application/json' \
              -d '{}' "$FS_API/$1:listCollectionIds" |
              python3 -c 'import json, sys
          try:
              d = json.load(sys.stdin)
              print("ERROR" if "error" in d else " ".join(d.get("collectionIds", [])))
          except Exception:
              print("ERROR")'
          }

          # passed / failed / skipped / unknown según el resumen del .xcresult.
          summary_verdict() {
            python3 - "$1" <<'PY'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              print("unknown")
              sys.exit(0)
          if d.get("failedTests", 0):
              print("failed")
          elif d.get("skippedTests", 0):
              print("skipped")
          elif d.get("passedTests", 0):
              print("passed")
          else:
              print("unknown")
          PY
          }

          # Ejecuta UN test de AuthFlowUITests con las cuentas de este job.
          # Nunca hace fallar el paso: deja PASS/FAIL en checks.txt y el
          # veredicto se da al final, después de publicar la evidencia.
          run_test() {
            # Sin `-e`: el código de salida de xcodebuild se lee, no corta el paso.
            set +e
            local name="$1"
            local bundle="$RUNNER_TEMP/xcresult/$name.xcresult"
            local log="$EVIDENCE/$name.log"
            mkdir -p "$RUNNER_TEMP/xcresult"
            rm -rf "$bundle"
            # xcodebuild pasa al proceso de los tests las variables
            # TEST_RUNNER_*, quitándoles el prefijo.
            TEST_RUNNER_TRAINING_OS_AUTH_E2E=1 \
            TEST_RUNNER_AUTH_EMAIL_A="$AUTH_EMAIL_A" \
            TEST_RUNNER_AUTH_EMAIL_B="$AUTH_EMAIL_B" \
            TEST_RUNNER_AUTH_USER_A="$AUTH_USER_A" \
            TEST_RUNNER_AUTH_USER_B="$AUTH_USER_B" \
            TEST_RUNNER_AUTH_PASSWORD="$AUTH_PASSWORD" \
            xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
              -sdk iphonesimulator -destination "id=$SIM_UDID" \
              -derivedDataPath build -clonedSourcePackagesDirPath spm \
              -resultBundlePath "$bundle" -parallel-testing-enabled NO \
              "-only-testing:TrainingOSUITests/AuthFlowUITests/$name" \
              test-without-building > "$log" 2>&1
            local rc=$?
            grep -E 'Test Case|error:|failed|passed|skipped|TEST' "$log" | tail -n 60
            xcrun xcresulttool get test-results summary --path "$bundle" > "$EVIDENCE/$name-summary.json" 2>/dev/null
            local verdict
            verdict=$(summary_verdict "$EVIDENCE/$name-summary.json")
            if [ "$verdict" = unknown ]; then
              if grep -qE "$name\]' passed" "$log"; then verdict=passed
              elif grep -qE "$name\]' skipped" "$log"; then verdict=skipped
              else verdict=failed
              fi
            fi
            if [ "$rc" -eq 0 ] && [ "$verdict" = passed ]; then
              pass "$name"
            elif [ "$verdict" = skipped ]; then
              fail "$name se ha saltado: no le ha llegado TRAINING_OS_AUTH_E2E=1"
            else
              fail "$name (xcodebuild $rc, $verdict; ver auth/$name.log y las capturas de auth/$name/)"
            fi
            return 0
          }
          LIB
          echo "auth-lib.sh listo"

      - name: Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          { xcodebuild -version; xcrun simctl list runtimes; sw_vers; } | tee "$EVIDENCE/env.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # El emulador de Firestore es Java (firebase-tools 15 pide Java 21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Los JAR de los emuladores se descargan la primera vez: se guardan.
      - name: Caché de los emuladores de Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: npm ci
        run: npm ci

      - name: Paquete web en modo test (Firebase en los emuladores)
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          set +e
          npx tsc -b > "$EVIDENCE/web-build.log" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            npx vite build --mode test >> "$EVIDENCE/web-build.log" 2>&1
            rc=$?
          fi
          tail -n 20 "$EVIDENCE/web-build.log"
          if [ "$rc" -ne 0 ]; then
            fail "paquete web en modo test (código $rc)"
            exit "$rc"
          fi
          # El paquete tiene que llevar la configuración de .env.test: si no,
          # la app arrancaría en modo local, sin cuentas.
          if grep -rqs "$FB_PROJECT" dist/assets; then
            pass "el paquete web apunta al proyecto $FB_PROJECT de los emuladores"
          else
            fail "el paquete web no lleva la configuración de .env.test"
            exit 1
          fi

      - name: cap sync ios
        run: |
          set +e
          npx cap sync ios > "$EVIDENCE/cap-sync.txt" 2>&1
          rc=$?
          cat "$EVIDENCE/cap-sync.txt"
          exit $rc

      # SÓLO en esta compilación de CI, y nunca en git: la app habla por HTTP
      # con los emuladores en 127.0.0.1, y App Transport Security lo bloquearía.
      # NSAllowsLocalNetworking permite únicamente direcciones locales; el
      # Info.plist del repositorio no lleva ninguna excepción de ATS.
      - name: Info.plist de CI (red local para los emuladores)
        run: |
          set +e
          plutil -replace NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' ios/App/App/Info.plist
          rc=$?
          plutil -lint ios/App/App/Info.plist
          plutil -extract NSAppTransportSecurity json -o - ios/App/App/Info.plist | tee "$EVIDENCE/info-plist-ats.txt"
          exit $rc

      - name: Emuladores de Firebase (auth, firestore, storage)
        timeout-minutes: 10
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          nohup npx firebase emulators:start --only auth,firestore,storage --project "$FB_PROJECT" \
            > "$RUNNER_TEMP/emulators.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulators.pid"
          ready=0
          for i in $(seq 120); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:9099/ && curl -s -o /dev/null --max-time 2 http://127.0.0.1:8080/; then
              ready=1
              break
            fi
            sleep 2
          done
          tail -n 30 "$RUNNER_TEMP/emulators.log"
          if [ "$ready" -eq 1 ]; then
            pass "emuladores de Auth (9099) y Firestore (8080) en marcha"
          else
            fail "los emuladores no responden en 4 minutos"
            exit 1
          fi

      - name: Cuentas de prueba (desechables, sólo en el emulador de este job)
        run: |
          SUFFIX="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          {
            echo "AUTH_EMAIL_A=a${SUFFIX}@example.com"
            echo "AUTH_EMAIL_B=b${SUFFIX}@example.com"
            # Usuario: 3–20 caracteres de [a-z0-9_.].
            echo "AUTH_USER_A=ua${SUFFIX}"
            echo "AUTH_USER_B=ub${SUFFIX}"
            # Letras (mayúsculas y minúsculas) y números: la app pide 8+ con letra y número.
            echo "AUTH_PASSWORD=Tos$(openssl rand -hex 6)A9"
          } >> "$GITHUB_ENV"

      - name: Elegir simulador (iPhone 17 Pro)
        id: sim
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          def pick(name):
              best = None
              for runtime, devices in data['devices'].items():
                  if 'iOS' not in runtime:
                      continue
                  version = tuple(int(x) for x in runtime.rsplit('iOS-', 1)[-1].split('-') if x.isdigit())
                  for d in devices:
                      if d['name'] == name and (best is None or version > best[0]):
                          best = (version, d['udid'])
              return best[1] if best else ''
          print(f"pro={pick('iPhone 17 Pro')}")
          PY
          cat "$GITHUB_OUTPUT" | tee "$EVIDENCE/simulator.txt"
          UDID=$(grep '^pro=' "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)
          if [ -z "$UDID" ]; then
            fail "no hay simulador iPhone 17 Pro"
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Compilar para simulador (Debug) y tests
        timeout-minutes: 45
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          set +e
          xcodebuild -project "$PROJECT" -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "id=$SIM_UDID" \
            -derivedDataPath build -clonedSourcePackagesDirPath spm \
            build-for-testing > "$EVIDENCE/build-simulator.log" 2>&1
          rc=$?
          grep -E 'error:|BUILD|TEST BUILD' "$EVIDENCE/build-simulator.log" | tail -n 120
          if [ "$rc" -ne 0 ]; then
            fail "build-for-testing (xcodebuild $rc)"
            exit "$rc"
          fi
          pass "build-for-testing"

      - name: Arrancar el simulador (instalación limpia)
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          # El test 1 es una instalación nueva: sin restos de nada.
          xcrun simctl uninstall "$SIM_UDID" com.trainingos.app || true

      # ------------------------------------------------------------------ 1
      - name: test1 — registro, cuestionario, entrenamiento y subida
        timeout-minutes: 25
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test1_signupOnboardTrainAndSync

      - name: Firestore tras el test 1
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          A_UID=$(uid_of "$AUTH_EMAIL_A")
          if [ -z "$A_UID" ]; then
            fail "la cuenta A existe en el emulador de Auth"
            exit 0
          fi
          pass "la cuenta A existe en el emulador de Auth"
          echo "A_UID=$A_UID" >> "$GITHUB_ENV"
          [ "$(fs_status "users/$A_UID")" = 200 ] && pass "A tiene perfil en Firestore (users/<uid>)" || fail "A tiene perfil en Firestore (users/<uid>)"
          [ "$(fs_status "usernames/$AUTH_USER_A")" = 200 ] && pass "el usuario @$AUTH_USER_A está reservado" || fail "el usuario @$AUTH_USER_A está reservado"
          n=-1
          for i in $(seq 30); do
            n=$(fs_count "$A_UID" sessions)
            [ "$n" -ge 1 ] && break
            sleep 2
          done
          if [ "$n" -ge 1 ]; then pass "A tiene $n sesión(es) en Firestore tras entrenar"; else fail "A no tiene ninguna sesión en Firestore tras entrenar ($n)"; fi

      # ------------------------------------------------------------------ 2
      - name: test2 — la sesión sigue tras cerrar y abrir la app
        timeout-minutes: 15
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test2_sessionPersistsAcrossRelaunch

      # ------------------------------------------------------------------ 3
      - name: test3 — cerrar sesión e iniciarla otra vez
        timeout-minutes: 20
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test3_logoutAndLogin

      # ------------------------------------------------------------------ 4
      - name: test4 — recuperar la contraseña
        timeout-minutes: 20
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test4_passwordResetRequest

      - name: Emulador de Auth tras el test 4 (códigos enviados)
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          # Lo que habría salido por correo: el emulador lo guarda en vez de enviarlo.
          curl -s --max-time 10 "$AUTH_API/emulator/v1/projects/$FB_PROJECT/oobCodes" > "$RUNNER_TEMP/oob.json" || true
          verdict=$(python3 - "$RUNNER_TEMP/oob.json" "$AUTH_EMAIL_A" <<'PY'
          import json, sys
          try:
              codes = json.load(open(sys.argv[1])).get("oobCodes", [])
          except Exception:
              print("error")
              sys.exit(0)
          email = sys.argv[2].lower()
          reset = [c for c in codes if c.get("requestType") == "PASSWORD_RESET" and c.get("email", "").lower() == email]
          verify = [c for c in codes if c.get("requestType") == "VERIFY_EMAIL"]
          print(f"{len(reset)} {len(verify)}")
          PY
          )
          echo "códigos: $verdict"
          if [ "$verdict" = error ]; then
            fail "no se pudo leer oobCodes del emulador de Auth"
            exit 0
          fi
          set -- $verdict
          [ "$1" -ge 1 ] && pass "se generó un PASSWORD_RESET para el email de A ($1)" || fail "no hay ningún PASSWORD_RESET para el email de A"
          [ "$2" -eq 0 ] && pass "el registro no envió ningún VERIFY_EMAIL" || fail "el emulador emitió $2 código(s) VERIFY_EMAIL"

      # ------------------------------------------------------------------ 5
      - name: Cortar la red de Firebase (pf)
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          # Antes de cortar: después, tampoco este job llega a Firestore.
          n=$(fs_count "$A_UID" sessions)
          echo "A_BEFORE_OFFLINE=$n" >> "$GITHUB_ENV"
          info "A tiene $n sesión(es) en Firestore antes del arranque sin conexión"
          [ "$n" -ge 0 ] || fail "no se pudo leer las sesiones de A antes de cortar la red"
          # «block return» contesta con un RST: la conexión se rechaza al
          # instante, como en un móvil sin red, en vez de quedarse colgada hasta
          # el tiempo máximo. Sólo esos tres puertos de lo0: el simulador y
          # xcodebuild siguen hablando por lo demás.
          set +e
          echo 'block return quick on lo0 proto tcp from any to any port { 8080, 9099, 9199 }' | sudo pfctl -ef - > "$EVIDENCE/pfctl.txt" 2>&1
          echo "pfctl -ef: código $?" >> "$EVIDENCE/pfctl.txt"
          sudo pfctl -sr >> "$EVIDENCE/pfctl.txt" 2>&1
          cat "$EVIDENCE/pfctl.txt"
          curl -s -o /dev/null --max-time 5 http://127.0.0.1:9099/
          rc9099=$?
          curl -s -o /dev/null --max-time 5 http://127.0.0.1:8080/
          rc8080=$?
          if [ "$rc9099" -ne 0 ] && [ "$rc8080" -ne 0 ]; then
            pass "pf corta 9099 y 8080 (curl $rc9099 / $rc8080)"
          else
            fail "pf no corta los puertos de Firebase (curl $rc9099 / $rc8080)"
          fi

      - name: test5 — arranque en frío sin conexión
        timeout-minutes: 25
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test5_offlineColdStart

      - name: Devolver la red de Firebase
        if: always()
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          sudo pfctl -d 2>&1 | tee -a "$EVIDENCE/pfctl.txt" || true
          set +e
          ok=0
          for i in $(seq 15); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:9099/ && curl -s -o /dev/null --max-time 2 http://127.0.0.1:8080/; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" -eq 1 ] && pass "la red de Firebase vuelve (pf desactivado)" || fail "los emuladores no responden tras desactivar pf"
          # Con la app cerrada al final del test 5, nada pudo subir todavía.
          if [ -n "$A_UID" ] && [ -n "$A_BEFORE_OFFLINE" ]; then
            n=$(fs_count "$A_UID" sessions)
            [ "$n" = "$A_BEFORE_OFFLINE" ] && pass "sin conexión no llegó nada a Firestore ($n sesiones)" || fail "sin conexión cambió Firestore: $A_BEFORE_OFFLINE → $n sesiones"
          fi

      # ------------------------------------------------------------------ 6
      - name: test6 — con red otra vez, la cola sube
        timeout-minutes: 20
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test6_onlineResync

      - name: Firestore tras el test 6 (exactamente una sesión más)
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          if [ -z "$A_UID" ] || [ -z "$A_BEFORE_OFFLINE" ]; then
            fail "sin uid de A o sin la cuenta previa: no se puede comprobar la resincronización"
            exit 0
          fi
          start=$(date +%s)
          n=-1
          # Firestore espera más tras varios fallos: hasta dos minutos.
          for i in $(seq 60); do
            n=$(fs_count "$A_UID" sessions)
            [ "$n" -gt "$A_BEFORE_OFFLINE" ] && break
            sleep 2
          done
          # Un poco más, por si llegara un duplicado detrás.
          sleep 8
          n=$(fs_count "$A_UID" sessions)
          info "la sesión hecha sin conexión llegó en ~$(( $(date +%s) - start )) s; Firestore: $A_BEFORE_OFFLINE → $n sesiones"
          echo "A_AFTER_RESYNC=$n" >> "$GITHUB_ENV"
          if [ "$n" -eq $(( A_BEFORE_OFFLINE + 1 )) ]; then
            pass "la sesión hecha sin conexión llegó a Firestore exactamente una vez ($A_BEFORE_OFFLINE → $n)"
          else
            fail "la sesión hecha sin conexión no llegó exactamente una vez ($A_BEFORE_OFFLINE → $n)"
          fi

      # ------------------------------------------------------------------ 7
      - name: test7 — cambio de cuenta sin fugas
        timeout-minutes: 25
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test7_accountSwitchNoLeak

      - name: Firestore tras el test 7 (B empieza vacía)
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          B_UID=$(uid_of "$AUTH_EMAIL_B")
          if [ -z "$B_UID" ]; then
            fail "la cuenta B existe en el emulador de Auth"
            exit 0
          fi
          pass "la cuenta B existe en el emulador de Auth"
          echo "B_UID=$B_UID" >> "$GITHUB_ENV"
          [ "$(fs_status "users/$B_UID")" = 200 ] && pass "B tiene perfil en Firestore" || fail "B tiene perfil en Firestore"
          sleep 5
          n=$(fs_count "$B_UID" sessions)
          if [ "$n" -eq 0 ]; then
            pass "B no tiene ninguna sesión en Firestore (nada de A)"
          elif [ "$n" -lt 0 ]; then
            fail "no se pudieron leer las sesiones de B en Firestore"
          else
            fail "B tiene $n sesión(es) en Firestore: se ha colado algo de A"
          fi
          if [ -n "$A_UID" ]; then
            info "A tiene $(fs_count "$A_UID" sessions) sesión(es) en Firestore tras descartar su entrenamiento en curso"
          fi

      # ------------------------------------------------------------------ 8
      - name: test8 — eliminar la cuenta (contraseña mal, luego bien)
        timeout-minutes: 20
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          run_test test8_deleteAccountWrongThenRight

      - name: Firestore tras el test 8 (de B no queda nada, A intacta)
        run: |
          source "$RUNNER_TEMP/auth-lib.sh"
          if [ -z "$B_UID" ]; then
            fail "sin uid de B (test 7): no se puede comprobar el borrado"
          else
            [ -z "$(uid_of "$AUTH_EMAIL_B")" ] && pass "la cuenta B ya no existe en Auth" || fail "la cuenta B sigue existiendo en Auth"
            [ "$(fs_status "users/$B_UID")" = 404 ] && pass "el perfil de B ya no está en Firestore" || fail "el perfil de B sigue en Firestore"
            [ "$(fs_status "usernames/$AUTH_USER_B")" = 404 ] && pass "el usuario @$AUTH_USER_B queda libre" || fail "el usuario @$AUTH_USER_B sigue reservado"
            left=""
            for c in $SYNCED; do
              n=$(fs_count "$B_UID" "$c")
              [ "$n" -eq 0 ] || left="$left $c=$n"
            done
            [ -z "$left" ] && pass "ninguna colección de B conserva documentos" || fail "a B le quedan documentos:$left"
            subs=$(fs_subcollections "users/$B_UID")
            if [ "$subs" = ERROR ]; then
              info "el emulador no respondió a listCollectionIds de users/<B>"
            elif [ -z "$subs" ]; then
              pass "users/<B> no tiene subcolecciones con documentos"
            else
              fail "users/<B> conserva subcolecciones: $subs"
            fi
          fi
          if [ -z "$A_UID" ]; then
            fail "sin uid de A: no se puede comprobar que sigue intacta"
          else
            [ "$(uid_of "$AUTH_EMAIL_A")" = "$A_UID" ] && pass "la cuenta A sigue en Auth" || fail "la cuenta A ya no inicia sesión en Auth"
            [ "$(fs_status "users/$A_UID")" = 200 ] && pass "el perfil de A sigue en Firestore" || fail "el perfil de A ha desaparecido"
            [ "$(fs_status "usernames/$AUTH_USER_A")" = 200 ] && pass "el usuario @$AUTH_USER_A sigue reservado" || fail "el usuario @$AUTH_USER_A ya no está reservado"
            n=$(fs_count "$A_UID" sessions)
            want=${A_AFTER_RESYNC:-1}
            [ "$n" -ge "$want" ] && pass "A conserva sus $n sesiones" || fail "A ha perdido sesiones: $n (había $want)"
          fi

      # ------------------------------------------------------- evidencia y cierre
      - name: Extraer capturas de los tests
        if: always()
        run: |
          for B in "$RUNNER_TEMP"/xcresult/*.xcresult; do
            [ -d "$B" ] || continue
            NAME=$(basename "$B" .xcresult)
            mkdir -p "$EVIDENCE/$NAME"
            xcrun xcresulttool export attachments --path "$B" --output-path "$EVIDENCE/$NAME" 2>&1 | tail -n 3 || true
          done

      - name: Diagnóstico (simulador, emuladores, cierres)
        if: always()
        run: |
          mkdir -p "$EVIDENCE/diagnostics"
          if [ -n "$SIM_UDID" ]; then
            xcrun simctl spawn "$SIM_UDID" log show --last 150m --style compact \
              --predicate 'process == "App" OR process == "TrainingOSWidgets" OR (process == "SpringBoard" AND eventMessage CONTAINS[c] "trainingos")' \
              2>&1 | tail -n 4000 > "$EVIDENCE/diagnostics/sim-log.txt" || true
          fi
          tail -n 400 "$RUNNER_TEMP/emulators.log" > "$EVIDENCE/diagnostics/emulators.log" 2>/dev/null || true
          tail -n 200 firestore-debug.log > "$EVIDENCE/diagnostics/firestore-debug.log" 2>/dev/null || true
          ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -40 > "$EVIDENCE/diagnostics/crash-reports.txt" || true
          find ~/Library/Logs/DiagnosticReports -name 'App*' -newer "$EVIDENCE/run.txt" -exec cp {} "$EVIDENCE/diagnostics/" \; 2>/dev/null || true
          # Las grabaciones pesan demasiado para publicarlas: una hoja de
          # fotogramas (uno cada 3 s) por grabación.
          if command -v ffmpeg >/dev/null; then
            find "$EVIDENCE" -name '*.mp4' | while read -r V; do
              ffmpeg -loglevel error -i "$V" -vf "fps=1/3,scale=200:-1,tile=8x5" -frames:v 1 "${V%.mp4}-frames.jpg" || true
            done
          fi
          find "$EVIDENCE" -name '*.mp4' -delete

      - name: Parar los emuladores
        if: always()
        run: |
          sudo pfctl -d 2>/dev/null || true
          pkill -INT -f "emulators:start" 2>/dev/null || true
          for i in $(seq 15); do pgrep -f "emulators:start" >/dev/null || break; sleep 1; done
          pkill -9 -f "emulators:start" 2>/dev/null || true
          pkill -9 -f "cloud-firestore-emulator" 2>/dev/null || true

      - name: Publicar evidencia en ios-ci-evidence-auth
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf evidence-auth-repo && mkdir evidence-auth-repo && cd evidence-auth-repo
          git init -q
          git checkout -q -b ios-ci-evidence-auth
          cp -R "$GITHUB_WORKSPACE/evidence"/. .
          # Los registros completos pesan mucho: se guarda el final de cada uno.
          find . -name '*.log' -type f | while read -r f; do tail -n 400 "$f" > "$f.tail" && mv "$f.tail" "$f"; done
          git add -A
          git -c user.name="training-os-ci" -c user.email="training-os-ci@users.noreply.github.com" \
            commit -qm "iOS auth CI evidence: run $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-ci-evidence-auth

      - name: Veredicto
        if: always()
        run: |
          set +e
          CHECKS="$EVIDENCE/checks.txt"
          { echo '### Pruebas de cuenta en iOS'; echo '```'; cat "$CHECKS" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$CHECKS" 2>/dev/null
          if [ ! -s "$CHECKS" ]; then
            echo "No hay ninguna comprobación."
            exit 1
          fi
          if grep -q '^FAIL' "$CHECKS"; then
            echo "Hay comprobaciones fallidas."
            exit 1
          fi
          # Un paso que no llegó a ejecutarse no deja FAIL: los ocho tests
          # tienen que haber pasado.
          passed=$(grep -cE '^PASS test[1-8]_' "$CHECKS")
          if [ "$passed" -ne 8 ]; then
            echo "Sólo han pasado $passed de los 8 tests."
            exit 1
          fi
          echo "Todo en orden."
